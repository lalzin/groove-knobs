# Builds, tests and packages the Groove Knobs plugins (French Filter, Boogie
# Trio, Backwash, Pew Pew, Sing It Back) on macOS and Windows. Installers are attached to each run;
# pushing a tag "v<version>" also publishes a GitHub Release with the
# Windows installers (permanent public links).
name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # a release tag must match every plug-in's version (the installers carry it)
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag = plug-in versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          bad=$(grep -E '^set\((FF|BT|BW|PP|SIB|KL|GK_SUITE)_VERSION ' cmake/GrooveIds.cmake | grep -v "\"$tag\"" || true)
          if [ -n "$bad" ]; then echo "tag v$tag but:"; echo "$bad"; exit 1; fi
          echo "all plug-ins are $tag"

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, package
        run: |
          brew install ninja
          scripts/build_mac.sh
          for p in FF BT BW PP SIB KL; do scripts/make_installer_mac.sh --skip-build $p; done
          scripts/make_suite_installer_mac.sh --skip-build
      - uses: actions/upload-artifact@v4
        with:
          name: GrooveKnobs-macOS
          path: dist/*

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build, test, package
        shell: pwsh
        run: scripts/make_installer_win.ps1 -Plugin All
      - uses: actions/upload-artifact@v4
        with:
          name: GrooveKnobs-Windows
          path: dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GrooveKnobs-Windows
          path: release
      - name: Check the installers are there
        run: |
          ls -la release
          v="${GITHUB_REF_NAME#v}"
          for f in FrenchFilter BoogieTrio Backwash PewPew SingItBack KickLock GrooveKnobs; do ls release/$f-$v-Windows-Setup.exe; done
      - uses: softprops/action-gh-release@v2
        with:
          name: Groove Knobs ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: release/*.exe
