# Builds, tests and packages the Groove Knobs plugins (French Filter, Boogie
# Trio, Backwash) on macOS and Windows. Installers are attached to each run.
name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, package
        run: |
          brew install ninja
          scripts/build_mac.sh
          for p in FF BT BW; do scripts/make_installer_mac.sh --skip-build $p; done
      - uses: actions/upload-artifact@v4
        with:
          name: GrooveKnobs-macOS
          path: dist/*

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build, test, package
        shell: pwsh
        run: scripts/make_installer_win.ps1 -Plugin All
      - uses: actions/upload-artifact@v4
        with:
          name: GrooveKnobs-Windows
          path: dist/*.exe
