# Validates the 12 VST3 plug-ins on Windows (the format of Cubase, FL Studio,
# Ableton on Windows...) with the two references of the trade:
#   - Steinberg's "validator" (the VST3 SDK's official conformance test, the one
#     Cubase's own checks are based on), built from the SDK;
#   - pluginval (Tracktion), strictness 10: opening, parameters, state, audio
#     at several sample rates and block sizes, threads.
# Run by hand (Actions > validate > Run workflow) or on a push to main; it does
# not block the releases. Logs: the run's "validation-logs" artifact.
name: validate
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-vst3:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Build the VST3s
        shell: pwsh
        run: |
          # (symbols in the Release build: a crash's call stack can be read)
          cmake -S . -B build-win -G "Visual Studio 17 2022" -A x64 "-DCMAKE_CXX_FLAGS_RELEASE=/O2 /Ob2 /DNDEBUG /Zi" "-DCMAKE_MODULE_LINKER_FLAGS_RELEASE=/DEBUG /OPT:REF /OPT:ICF" "-DCMAKE_SHARED_LINKER_FLAGS_RELEASE=/DEBUG /OPT:REF /OPT:ICF"
          $targets = "FrenchFilter","BoogieTrio","Backwash","PewPew","SingItBack","KickLock","KickLockSend","Slapper","Crackle","HeadSpin","Ballroom","DaftChunk" | ForEach-Object { "${_}_VST3" }
          cmake --build build-win --config Release --parallel --target $targets

      - name: Build Steinberg's validator
        shell: pwsh
        run: |
          git clone --depth 1 --recursive --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git $env:RUNNER_TEMP\vst3sdk
          cmake -S $env:RUNNER_TEMP\vst3sdk -B $env:RUNNER_TEMP\vst3sdk-build -G "Visual Studio 17 2022" -A x64 `
            -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF
          cmake --build $env:RUNNER_TEMP\vst3sdk-build --config Release --target validator --parallel

      - name: Get pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile $env:RUNNER_TEMP\pluginval.zip
          Expand-Archive $env:RUNNER_TEMP\pluginval.zip -DestinationPath $env:RUNNER_TEMP\pluginval

      - name: Validate
        shell: pwsh
        run: |
          $validator = Get-ChildItem $env:RUNNER_TEMP\vst3sdk-build -Recurse -Filter validator.exe | Select-Object -First 1
          $pluginval = Get-ChildItem $env:RUNNER_TEMP\pluginval -Recurse -Filter pluginval.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force logs | Out-Null
          $plugins = Get-ChildItem build-win\plugins -Recurse -Directory -Filter *.vst3 | Where-Object { $_.FullName -match '\\Release\\VST3\\[^\\]+\.vst3$' }
          if ($plugins.Count -ne 12) { Write-Host "expected 12 VST3s, found $($plugins.Count)"; exit 1 }
          $failed = @()
          $report = @()
          foreach ($p in $plugins) {
            $n = $p.BaseName -replace ' ', '_'
            & $validator.FullName $p.FullName *> "logs\$n-steinberg.log"
            $sv = $LASTEXITCODE
            & $pluginval.FullName --strictness-level 10 --validate-in-process --timeout-ms 600000 --validate $p.FullName *> "logs\$n-pluginval.log"
            $pv = $LASTEXITCODE
            $s = if ($sv -eq 0) { "OK" } else { "FAILED" }
            $v = if ($pv -eq 0) { "OK" } else { "FAILED" }
            $line = ("{0,-16} Steinberg: {1,-6} (code {3})  pluginval 10: {2} (code {4})" -f $p.BaseName, $s, $v, $sv, $pv)
            Write-Host $line; $report += $line
            if ($sv -ne 0) { $failed += "$($p.BaseName) (Steinberg)"; Select-String -Path "logs\$n-steinberg.log" -Pattern "\[Failed\]|ERROR|failed" | Select-Object -First 8 | ForEach-Object { $report += "    S: $($_.Line.Trim())" }; Get-Content "logs\$n-steinberg.log" -Tail 20 | ForEach-Object { $report += "    S> $_" } }
            if ($pv -ne 0) { $failed += "$($p.BaseName) (pluginval)"; Select-String -Path "logs\$n-pluginval.log" -Pattern "FAILED|!!!|Error" | Select-Object -First 8 | ForEach-Object { $report += "    P: $($_.Line.Trim())" }; Get-Content "logs\$n-pluginval.log" -Tail 25 | ForEach-Object { $report += "    P> $_" } }
          }
          # the report as an annotation: readable without signing in (logs are not)
          $msg = ($report -join "`n").Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
          Write-Host "::notice title=VST3 validation::$msg"
          if ($failed.Count -gt 0) { Write-Host "FAILED: $($failed -join ', ')"; exit 1 }
          Write-Host "All 12 VST3s pass both validators."

      # Kick Lock crashed now and then on Windows (the scope written past its rings after a rate change, fixed 2026-11-28):
      # run again a few times under the debugger, the call stack of a crash kept
      - name: Kick Lock, repeated
        if: always()
        shell: pwsh
        run: |
          $validator = Get-ChildItem $env:RUNNER_TEMP\vst3sdk-build -Recurse -Filter validator.exe | Select-Object -First 1
          $pluginval = Get-ChildItem $env:RUNNER_TEMP\pluginval -Recurse -Filter pluginval.exe | Select-Object -First 1
          $kl = Get-ChildItem build-win\plugins\kick_lock -Recurse -Directory -Filter "Kick Lock.vst3" | Where-Object { $_.FullName -match '\\Release\\VST3\\' } | Select-Object -First 1
          New-Item -ItemType Directory -Force logs | Out-Null
          $report = @(); $bad = 0
          # under the debugger: the call stack of the first crash
          $cdb = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $pdb = Get-ChildItem build-win -Recurse -Filter "Kick Lock.pdb" | Select-Object -First 1
          $report += "cdb: $($cdb.FullName)  pdb: $($pdb.FullName)"
          $stacked = $false
          for ($i = 1; $i -le 5; $i++) {
            if ($cdb -and -not $stacked) {
              & $cdb.FullName -g -G -lines -y "$($pdb.DirectoryName);srv*" -c ".ecxr; r; kn 40; q" $validator.FullName $kl.FullName *> "logs\kl-cdb-$i.log"
              $c = $LASTEXITCODE
              $txt = Get-Content "logs\kl-cdb-$i.log"
              $crash = $txt | Select-String -Pattern "Access violation|c0000005|second chance" -Quiet
              $report += "Steinberg under cdb #${i}: code $c, crash: $crash"
              if ($crash) { $bad++; $stacked = $true; $at = ($txt | Select-String -Pattern "Access violation|c0000005" | Select-Object -First 1).LineNumber; $txt | Select-Object -Skip ([Math]::Max(0, $at - 3)) -First 90 | ForEach-Object { $report += "    > $_" } }
            } else {
              & $validator.FullName $kl.FullName *> "logs\kl-steinberg-$i.log"; $c = $LASTEXITCODE
              $report += "Steinberg #${i}: code $c"
              if ($c -ne 0) { $bad++ }
            }
          }
          for ($i = 1; $i -le 1; $i++) {
            & $pluginval.FullName --strictness-level 10 --validate-in-process --timeout-ms 600000 --validate $kl.FullName *> "logs\kl-pluginval-$i.log"; $c = $LASTEXITCODE
            $report += "pluginval #${i}: code $c"
            if ($c -ne 0) { $bad++; if ($i -eq 1) { Get-Content "logs\kl-pluginval-$i.log" -Tail 30 | ForEach-Object { $report += "    > $_" } } }
          }
          $msg = ($report -join "`n").Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
          Write-Host "::notice title=Kick Lock repeated::$msg"
          if ($bad -gt 0) { exit 1 }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-logs
          path: logs/
